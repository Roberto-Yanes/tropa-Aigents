# Relay de Tropa para el servidor de Galatea.
# Uso, desde la raíz del repo: docker compose -f relay/docker-compose.yml up -d --build
services:
  tropa-relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    image: tropa-relay:0.1.0
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: /data
      # Opcional: token de acceso de Expo para enviar notificaciones push con límites más altos.
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    volumes:
      - tropa-relay-data:/data
    # Publicá el puerto solo en localhost y dejá que el proxy HTTPS (Traefik, Nginx o Caddy) lo exponga con TLS.
    ports:
      - "127.0.0.1:8787:8787"
    mem_limit: 128m
volumes:
  tropa-relay-data:
